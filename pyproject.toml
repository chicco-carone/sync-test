[project]
name = "sync-test"
version = "0.1.0"
description = "Audio sync measurement tools for testing synchronized playback"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kevin Ahrendt", email = "kevin.ahrendt@openhomefoundation.org"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8.0"]

[project.scripts]
sync-measure = "sync_test.measure_sync:main"
sync-generate-chirp = "sync_test.generate_chirp:main"
sync-analyze = "sync_test.analyze:main"
sync-monitor = "sync_test.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sync_test"]
